[package]
name = "sid-pake-core"
description = "StructuredID OPAQUE-ZKPP: zero-knowledge password-policy circuits, verifier and reference prover (Halo2 on Pasta)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Consumed from this repository, not from crates.io.
publish = false

[dependencies]
# ZK proof system
halo2_proofs = { workspace = true }
halo2_gadgets = { workspace = true }

# Elliptic curves (Pallas/Vesta)
pasta_curves = { workspace = true }
ff = { workspace = true }
group = { workspace = true }
subtle = { workspace = true }

# OPAQUE + VOPRF CipherSuite
sid-opaque-ke = { workspace = true }
argon2 = { workspace = true }
sid-voprf = { workspace = true }
digest = { workspace = true }
hash2curve = { workspace = true }
hybrid-array = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

# General
rand = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = { workspace = true }

[[bench]]
name = "zkpp"
harness = false
